apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-dev
  namespace: argocd
  finalizers:
    # Without this, deleting the Application orphans every resource it created.
    # With it, ArgoCD cascades the delete. Know both behaviours - "I deleted
    # the App and the workloads kept running" is a common surprise.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/CaptainnRomeo/nucleus-platform.git
    # A branch is a MOVING target. Fine for dev; production should pin a tag
    # or commit SHA so a merge to main cannot silently change prod.
    targetRevision: main
    path: deploy/base

  destination:
    server: https://kubernetes.default.svc
    namespace: payments

  syncPolicy:
    automated:
      # Reverts out-of-band cluster changes back to Git. This is the switch
      # that turns "ArgoCD noticed" into "ArgoCD acted".
      selfHeal: true
      # Deletes resources removed from Git. Off by default because a bad
      # merge that drops a file would delete production. Enable deliberately.
      prune: true
      # Do not self-heal into a broken state if the last sync failed.
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

