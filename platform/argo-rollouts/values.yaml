# Argo Rollouts controller. Installs the Rollout, AnalysisTemplate,
# AnalysisRun and Experiment CRDs plus the controller that reconciles them.
controller:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

# Read-only UI for watching canary progress. Genuinely useful here because
# the step-by-step traffic shift is much clearer visually than in CLI output.
dashboard:
  enabled: true
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
