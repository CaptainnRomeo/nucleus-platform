apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: payments
spec:
  args:
    # Rollouts injects the CANARY ReplicaSet's pod-template-hash here.
    # This is what scopes the query to pods under test.
    - name: canary-hash

  metrics:
    - name: success-rate
      initialDelay: 90s
      interval: 20s
      # Abort on the FIRST breach. failureLimit is a tolerance, not a
      # trigger count - failureLimit: 3 means "allow 3 failures", which
      # is how a 25% error rate previously sailed through the gate.
      failureLimit: 0
      # Still tolerate transient scrape gaps. "Cannot measure" is not
      # the same as "measured and bad".
      consecutiveErrorLimit: 3
      successCondition: result[0] >= 0.95
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{
              job="payment-api",
              rollouts_pod_template_hash="{{args.canary-hash}}",
              status!~"5.."
            }[1m]))
            /
            sum(rate(http_requests_total{
              job="payment-api",
              rollouts_pod_template_hash="{{args.canary-hash}}"
            }[1m]))
