apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-worker
  namespace: kafka
  labels:
    app.kubernetes.io/name: ledger-worker
spec:
  # Start at 1 so you can watch KEDA scale it. Never exceed partition count
  # (3) - a 4th consumer in the group sits idle with no assignment.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-worker
    spec:
      # Must exceed worst-case time to finish the in-flight message plus
      # leave the group cleanly. SIGKILL mid-message means the offset is
      # never committed and the message replays - safe here because we are
      # at-least-once, but it costs duplicate work.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: nucleus/ledger-worker:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "payments.events"
            - name: KAFKA_GROUP
              value: "ledger-workers"
            # 200ms per message = ~5 msg/sec per replica. Slow on purpose:
            # 520 messages of backlog will take one replica ~2 minutes,
            # which is long enough to watch KEDA react.
            - name: PROCESSING_TIME_S
              value: "0.2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 5
