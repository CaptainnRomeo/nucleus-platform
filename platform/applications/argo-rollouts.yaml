apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default

  sources:
    # Multi-source: chart from the upstream Helm repo, values from OUR git repo.
    # This is the pattern that keeps you off "curl | kubectl apply" while
    # still version-controlling your own configuration.
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.40.4
      helm:
        valueFiles:
          - $values/platform/argo-rollouts/values.yaml
    - repoURL: https://github.com/CaptainnRomeo/nucleus-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts


  # CRDs round-trip through the API server with defaulting and schema
  # normalization applied, so the live object never byte-matches what we
  # rendered. Without this the app sits permanently OutOfSync - which trains
  # everyone to ignore the dashboard, defeating the point of having one.


  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        # Deprecated field the API server defaults onto every CRD write.
        # The chart does not set it, so live never matches rendered and the
        # app sits permanently OutOfSync. Narrowly scoped on purpose - a
        # broad ignore here would hide real schema changes.
        - /spec/preserveUnknownFields
        - /status

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # CRDs exceed the 256KB annotation limit that client-side apply uses
      # to store last-applied-configuration. Replace sidesteps it entirely.
      - Replace=true
