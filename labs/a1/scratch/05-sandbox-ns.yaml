apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    # baseline, not restricted: blocks privilege escalation and host access,
    # but still permits root and arbitrary ports. Correct posture for a
    # break/fix namespace - production namespaces stay restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    nucleus.io/owner: platform-team
    nucleus.io/env: sandbox
