apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payments
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nucleus
    nucleus.io/tier: "0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  # Default is 600s. Shorter means a stuck rollout is flagged sooner - though
  # note it still will not auto-roll-back. That is Argo Rollouts' job.
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never dip below 3 ready - correct for tier-0
      maxSurge: 1         # one extra pod at a time; needs quota headroom
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
        app.kubernetes.io/version: "0.1.0"
    spec:
      # Longer than the preStop sleep plus real drain time, or SIGKILL
      # truncates in-flight payments.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-api
      containers:
        - name: api
          image: nucleus/payment-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              # memory limit == request: memory is incompressible, so
              # overcommitting it means OOM kills at the worst moment.
              memory: 96Mi
              cpu: 200m
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 15   # 30s budget for cold start
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            # /healthz, NOT /readyz. Liveness asks "is the process wedged?"
            # Pointing it at a dependency check turns a downstream outage
            # into a cluster-wide restart storm.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # Bridges the race between EndpointSlice removal and kube-proxy
              # convergence on every node. Without it you serve 502s on deploy.
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
